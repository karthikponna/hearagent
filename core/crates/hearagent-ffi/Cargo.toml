[package]
name = "hearagent-ffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "hearagent_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
hearagent-core.workspace = true
serde_json.workspace = true
uniffi = { version = "0.32", features = ["cli"] }

[dev-dependencies]
tempfile = "3"
