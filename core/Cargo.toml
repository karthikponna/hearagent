[workspace]
resolver = "2"
members = ["crates/hearagent-core", "crates/hearagent-hook", "crates/hearagent-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
hearagent-core = { path = "crates/hearagent-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
